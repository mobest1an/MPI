version: "3.8"

services:
  postgres:
    container_name: postgres
    image: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    entrypoint: >
      sh -c "chmod -R +x /docker-entrypoint-initdb.d/*.sh &&
             exec docker-entrypoint.sh postgres"
    ports:
      - "54320:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
    build: '.'
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/mpi
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    # needed on Linux so host.docker.internal resolves:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3030:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  tsung:
    build: ./tsung
    container_name: tsung
    volumes:
      - ./tsung/tsung.xml:/work/tsung.xml:ro
      - ./tsung/users.csv:/root/.tsung/users:ro
      - ./tsung/results:/results
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["tsung", "-f", "/work/tsung.xml", "-l", "/results", "start"]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  tsung-perform-test:
    build: './tsung/config'
    volumes:
      - ./tsung/config:/tsung/config
      - ./tsung/results/perform:/tsung/log
      - ./tsung/config/users.csv:/root/.tsung/users:ro
    ports:
      - "8091:8091"
    depends_on:
      - backend
    entrypoint: >
      sh -c "tsung -f /tsung/config/perform.xml -l /tsung/log start && \
             cd /tsung/log/\$(ls -1t /tsung/log | head -n 1) && \
             /usr/local/lib/tsung/bin/tsung_stats.pl"
