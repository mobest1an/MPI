  app:
    container_name: spring-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./private_key.der:/app/private_key.der:ro
      - ./public_key.der:/app/public_key.der:ro
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mpi
      DB_USERNAME: mpi
      DB_PASSWORD: mpi
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy