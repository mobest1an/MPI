version: "3.8"

services:
  postgres:
    container_name: postgres
    image: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
    volumes:
      - ./db/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    entrypoint: >
      sh -c "chmod -R +x /docker-entrypoint-initdb.d/*.sh &&
             exec docker-entrypoint.sh postgres"
    ports:
      - "54320:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    # needed on Linux so host.docker.internal resolves:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3030:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  tsung:
    build: ./tsung
    container_name: tsung
    volumes:
      - ./tsung/tsung.xml:/work/tsung.xml:ro
      - ./tsung/users.csv:/root/.tsung/users:ro
      - ./tsung/results:/results
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["tsung", "-f", "/work/tsung.xml", "-l", "/results", "start"]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535